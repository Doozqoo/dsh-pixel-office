name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # The browser half must resolve React through the shell's module table.
      # Bundling a private copy gives the page a second React instance and
      # every hook throws, so assert the artifact keeps React external.
      - name: Verify React stays external
        run: |
          grep -q 'require("react")' lib/client.js \
            || { echo 'lib/client.js does not require React externally'; exit 1; }

      # The browser has neither of these; a surviving reference is a
      # ReferenceError when the factory runs.
      - name: Verify build-time substitution
        run: |
          ! grep -q 'process\.env' lib/client.js || { echo 'process.env leaked'; exit 1; }
          ! grep -q 'import\.meta' lib/client.js || { echo 'import.meta leaked'; exit 1; }

      # A default export alongside named apply/inject makes the Loader discard
      # the function plugin's namespace, and the row contributes nothing.
      - name: Verify plugin export shape
        run: |
          grep -q 'exports\.apply' lib/client.js || { echo 'apply not exported'; exit 1; }
          grep -q 'exports\.inject' lib/client.js || { echo 'inject not exported'; exit 1; }
      # The publish view is what `dsh plugin add` installs. It must carry both
      # runtime halves and the Bundle patch that inserts the Loader row.
      # `pnpm pack --dry-run --json` differs from npm in two ways: the
      # `prepare` script runs first and its lifecycle logs share stdout, and
      # the JSON report is a flat array of `{ path }` file entries. Extract the
      # array (first `[{` to last `]`) and map paths directly.
      - name: Verify publish contents
        run: |
          pnpm pack --dry-run --json > pack.json
          node --input-type=module -e '
            import fs from "node:fs";
            const raw = fs.readFileSync("pack.json", "utf8");
            const json = raw.slice(raw.search(/\[\s*\{/), raw.lastIndexOf("]") + 1);
            const files = JSON.parse(json);
            const names = new Set(files.map(({ path }) => path));
            for (const required of ["lib/index.js", "lib/client.js", "cordis.patch.yml"]) {
              if (!names.has(required)) throw new Error(`publish artifact missing ${required}`);
            }
          '
